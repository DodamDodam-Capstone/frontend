name: Frontend CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main, development]
  push:
    branches: [main, development]

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: frontend-quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Detect project and package manager
        id: project
        shell: bash
        run: |
          if [[ ! -f package.json ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
          if [[ -f .nvmrc ]]; then
            echo "version-file=.nvmrc" >> "$GITHUB_OUTPUT"
          elif [[ -f .node-version ]]; then
            echo "version-file=.node-version" >> "$GITHUB_OUTPUT"
          else
            echo "package.json exists but .nvmrc or .node-version is missing." >&2
            exit 1
          fi
          if [[ -f pnpm-lock.yaml ]]; then
            echo "manager=pnpm" >> "$GITHUB_OUTPUT"
          elif [[ -f package-lock.json ]]; then
            echo "manager=npm" >> "$GITHUB_OUTPUT"
          elif [[ -f yarn.lock ]]; then
            echo "manager=yarn" >> "$GITHUB_OUTPUT"
          else
            echo "package.json exists but no supported lockfile was found." >&2
            exit 1
          fi

      - name: Repository readiness
        if: steps.project.outputs.ready != 'true'
        run: echo "Frontend source is not initialized yet; CI configuration is ready."

      - name: Set up Node.js
        if: steps.project.outputs.ready == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ${{ steps.project.outputs.version-file }}

      - name: Enable Corepack
        if: steps.project.outputs.ready == 'true' && steps.project.outputs.manager != 'npm'
        run: corepack enable

      - name: Install dependencies
        if: steps.project.outputs.ready == 'true'
        shell: bash
        env:
          MANAGER: ${{ steps.project.outputs.manager }}
        run: |
          case "$MANAGER" in
            npm) npm ci ;;
            pnpm) pnpm install --frozen-lockfile ;;
            yarn) yarn install --immutable ;;
          esac

      - name: Run configured checks
        if: steps.project.outputs.ready == 'true'
        shell: bash
        env:
          CI: "true"
          MANAGER: ${{ steps.project.outputs.manager }}
        run: |
          for script in lint typecheck test build; do
            if node -e "const p=require('./package.json'); process.exit(p.scripts?.['$script'] ? 0 : 1)"; then
              "$MANAGER" run "$script"
            fi
          done
