name: Jira Key

on:
  pull_request:
    branches: [development, main]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  jira-issue-key:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR merge and its parents
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: 작업 Jira 키 또는 main 승격 버전·본문 검사
        run: python3 .github/scripts/validate_pr_contract.py
