name: "🛠️ Frontend Task"
description: "Frontend 구현·리팩터링·문서 업무를 등록합니다. Jira Task가 자동 생성됩니다."
title: "[FE] "
labels: ["task"]
body:
  - type: markdown
    attributes:
      value: "생성 직후 Jira 키가 제목 앞에 자동 추가되고 Slack에 연결 결과가 전송됩니다."
  - type: input
    id: parent_jira
    attributes:
      label: "상위 Jira 키 (선택)"
      description: "기존 Epic 아래에 둘 경우 SCRUM-6 형식으로 입력하세요."
      placeholder: "SCRUM-6"
  - type: textarea
    id: goal
    attributes:
      label: "완료 목표"
      description: "무엇이 완료되어야 하는지 결과 중심으로 작성하세요."
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: "완료 조건"
      value: |
        - [ ] 구현 또는 문서 변경 완료
        - [ ] 필요한 테스트 통과
        - [ ] development 대상 PR 준비
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: "참고 사항"
